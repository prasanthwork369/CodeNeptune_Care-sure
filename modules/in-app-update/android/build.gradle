plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.codeneptune.caresure'
version = '1.0.0'

android {
  namespace "expo.modules.inappupdate"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Play In-App Updates. The official library, not a wrapper — this
  // module's Kotlin calls it directly.
  implementation 'com.google.android.play:app-update:2.1.0'
  implementation 'com.google.android.play:app-update-ktx:2.1.0'
}
