appId: com.codeneptune.caresure
---
# CareSure smoke test: login (OTP) -> search -> add to cart -> cart.
# Staging backend prefills the OTP, so we just type a number and tap through.
# Number is typed directly (the autofill hint sheet is dismissed by typing),
# which is far more reliable than driving the "Choose a phone number" sheet.

- launchApp:
    clearState: true

# --- Login ---
- extendedWaitUntil:
    visible: "Why pay more for the same medicine?"
    timeout: 15000
- tapOn:
    id: "phone-input"
# If the autofill hint sheet pops, dismiss it (Back closes the system sheet, not
# the app) so the field is ready for typing.
- runFlow:
    when:
      visible: "Choose a phone number"
    commands:
      - pressKey: Back
- inputText: "9999999999"
- tapOn: "Get OTP"

# --- OTP (backend-prefilled) ---
- extendedWaitUntil:
    visible: "Verify & Continue"
    timeout: 15000
- tapOn: "Verify & Continue"

# --- Home ---
- extendedWaitUntil:
    visible:
      id: "home-search-bar"
    timeout: 15000

# --- Search -> product ---
- tapOn:
    id: "home-search-bar"
- inputText: "Montecip"
# Wait for the result card (testID in SearchProductCard.tsx) and tap it.
- extendedWaitUntil:
    visible:
      id: "search-result-item"
    timeout: 10000
- tapOn:
    id: "search-result-item"

# --- Product comparison -> Add ---
# The result opens a comparison page; its button is exactly "Add" (^Add$ avoids
# matching words like "Address").
- extendedWaitUntil:
    visible:
      text: "^Add$"
    timeout: 10000
- tapOn:
    text: "^Add$"

# --- Cart ---
# After adding, the comparison footer shows "View Cart" -> cart screen.
- extendedWaitUntil:
    visible: "View Cart"
    timeout: 10000
- tapOn: "View Cart"
- assertVisible: "Cart"
