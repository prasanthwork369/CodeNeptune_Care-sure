appId: com.codeneptune.caresure
---
# CareSure Prescription Upload Flow: Launch -> Upload Sheet -> Attach -> Checkout

- launchApp:
    clearState: true

# Wait for phone input on splash finish
- extendedWaitUntil:
    visible:
      id: "phone-input"
    timeout: 20000

- tapOn:
    id: "phone-input"

- inputText: "9999999999"
- tapOn:
    id: "get-otp-btn"

- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Verify & Continue"

# Wait for Home screen to load
- extendedWaitUntil:
    visible:
      id: "home-search-bar"
    timeout: 15000

# Open Upload Prescription sheet
- tapOn: "Upload Prescription"

- extendedWaitUntil:
    visible: "Upload Valid Prescription"
    timeout: 5000

# Assert upload options are visible
- assertVisible: "Camera"
- assertVisible: "Gallery"
